<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="Inter,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93D7C0"/><stop offset=".55" stop-color="#40AC88"/><stop offset="1" stop-color="#148962"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FB57E"/><stop offset="1" stop-color="#16805A"/></linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E9A93B"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#094933" flood-opacity=".32"/></filter>
  </defs>
  <rect width="580" height="320" fill="url(#bg)"/>
  <rect x="40" y="40" width="180" height="230" rx="34" fill="#fff" opacity=".22" transform="skewX(-12)"/>
  <rect x="410" y="26" width="140" height="118" rx="30" fill="#fff" opacity=".24"/>
  <circle cx="500" cy="250" r="70" fill="#fff" opacity=".14"/>
  <!-- banknotes -->
  <g filter="url(#sh)" transform="rotate(-14 150 205)">
    <rect x="72" y="160" width="190" height="96" rx="12" fill="url(#note)"/>
    <rect x="84" y="172" width="166" height="72" rx="8" fill="none" stroke="#BFF0D9" stroke-width="2" opacity=".7"/>
    <circle cx="167" cy="208" r="22" fill="#BFF0D9" opacity=".55"/>
    <text x="167" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#0F5E41">₫</text>
  </g>
  <g filter="url(#sh)" transform="rotate(-4 160 200)">
    <rect x="86" y="150" width="190" height="96" rx="12" fill="url(#note)"/>
    <rect x="98" y="162" width="166" height="72" rx="8" fill="none" stroke="#BFF0D9" stroke-width="2" opacity=".8"/>
    <circle cx="181" cy="198" r="22" fill="#BFF0D9" opacity=".6"/>
    <text x="181" y="206" text-anchor="middle" font-size="22" font-weight="700" fill="#0F5E41">₫</text>
  </g>
  <!-- coins -->
  <g filter="url(#sh)">
    <ellipse cx="300" cy="262" rx="34" ry="11" fill="#C98722"/>
    <rect x="266" y="236" width="68" height="26" fill="#E9A93B"/>
    <ellipse cx="300" cy="236" rx="34" ry="11" fill="url(#coin)"/>
    <rect x="266" y="214" width="68" height="22" fill="#E9A93B"/>
    <ellipse cx="300" cy="214" rx="34" ry="11" fill="url(#coin)"/>
    <ellipse cx="300" cy="214" rx="22" ry="6" fill="none" stroke="#C98722" stroke-width="2"/>
  </g>
  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="330" y="34" width="150" height="270" rx="26" fill="#133143"/>
    <rect x="339" y="44" width="132" height="250" rx="19" fill="#F6F7FB"/>
    <rect x="385" y="50" width="40" height="8" rx="4" fill="#133143"/>
    <rect x="351" y="72" width="62" height="8" rx="4" fill="#133143"/>
    <rect x="351" y="86" width="96" height="6" rx="3" fill="#B9C0D6"/>
    <!-- result card -->
    <rect x="349" y="104" width="112" height="86" rx="12" fill="#fff" stroke="#E4E7F0"/>
    <rect x="358" y="114" width="26" height="26" rx="7" fill="#D3EFE6"/>
    <path d="M364 127l4 4 9-9" stroke="#148962" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="390" y="116" width="58" height="7" rx="3.5" fill="#133143"/>
    <rect x="390" y="129" width="40" height="6" rx="3" fill="#B9C0D6"/>
    <text x="358" y="164" font-size="15" font-weight="700" fill="#133143">50.000.000₫</text>
    <rect x="358" y="173" width="92" height="7" rx="3.5" fill="#E9ECF3"/>
    <rect x="358" y="173" width="70" height="7" rx="3.5" fill="#0E9F6E"/>
    <!-- second card -->
    <rect x="349" y="198" width="112" height="54" rx="12" fill="#fff" stroke="#E4E7F0"/>
    <rect x="358" y="208" width="26" height="26" rx="7" fill="#E6EDFC"/>
    <rect x="390" y="210" width="50" height="7" rx="3.5" fill="#133143"/>
    <rect x="390" y="223" width="34" height="6" rx="3" fill="#B9C0D6"/>
    <rect x="349" y="262" width="112" height="22" rx="11" fill="#0E9F6E"/>
    <rect x="378" y="270" width="54" height="6" rx="3" fill="#fff"/>
  </g>
  <!-- badge -->
  <g filter="url(#sh)">
    <rect x="452" y="96" width="104" height="34" rx="17" fill="#fff"/>
    <circle cx="471" cy="113" r="9" fill="#16A06D"/>
    <path d="M466.5 113l3 3 6-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="486" y="118" font-size="12.5" font-weight="700" fill="#0F5E41">Phù hợp</text>
  </g>
</svg>
