<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="Inter,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC4A3"/><stop offset=".55" stop-color="#FF8A55"/><stop offset="1" stop-color="#F25A20"/></linearGradient>
    <linearGradient id="sd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357F"/><stop offset="1" stop-color="#0E1846"/></linearGradient>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8A2C05" flood-opacity=".32"/></filter>
  </defs>
  <rect width="460" height="560" rx="28" fill="url(#bg)"/>
  <rect x="30" y="40" width="190" height="300" rx="40" fill="#fff" opacity=".2" transform="skewX(-12)"/>
  <circle cx="400" cy="470" r="110" fill="#fff" opacity=".13"/>
  <circle cx="390" cy="70" r="46" fill="#fff" opacity=".18"/>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="118" y="70" width="224" height="440" rx="36" fill="#101B4D"/>
    <rect x="130" y="82" width="200" height="416" rx="27" fill="#F6F7FB"/>
    <rect x="200" y="92" width="60" height="10" rx="5" fill="#101B4D"/>
    <text x="148" y="136" font-size="12" font-weight="600" fill="#58627F">Thông tin đăng ký</text>
    <rect x="148" y="144" width="164" height="6" rx="3" fill="#E4E7F0"/>
    <rect x="148" y="144" width="82" height="6" rx="3" fill="#FF642E"/>
    <text x="148" y="178" font-size="15" font-weight="700" fill="#101B4D">Thu nhập mỗi tháng?</text>
    <!-- options -->
    <rect x="146" y="194" width="168" height="40" rx="11" fill="#fff" stroke="#E4E7F0"/>
    <circle cx="166" cy="214" r="7" fill="none" stroke="#B9C0D6" stroke-width="2"/>
    <rect x="182" y="210" width="78" height="8" rx="4" fill="#B9C0D6"/>
    <rect x="146" y="242" width="168" height="40" rx="11" fill="#FFF1EA" stroke="#FF642E" stroke-width="2"/>
    <circle cx="166" cy="262" r="7" fill="#FF642E"/><circle cx="166" cy="262" r="2.8" fill="#fff"/>
    <text x="182" y="267" font-size="13" font-weight="700" fill="#101B4D">10 – 20 triệu</text>
    <rect x="146" y="290" width="168" height="40" rx="11" fill="#fff" stroke="#E4E7F0"/>
    <circle cx="166" cy="310" r="7" fill="none" stroke="#B9C0D6" stroke-width="2"/>
    <rect x="182" y="306" width="64" height="8" rx="4" fill="#B9C0D6"/>
    <rect x="146" y="338" width="168" height="40" rx="11" fill="#fff" stroke="#E4E7F0"/>
    <circle cx="166" cy="358" r="7" fill="none" stroke="#B9C0D6" stroke-width="2"/>
    <rect x="182" y="354" width="90" height="8" rx="4" fill="#B9C0D6"/>
    <!-- button -->
    <rect x="146" y="446" width="168" height="38" rx="19" fill="#FF642E"/>
    <text x="230" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Xem gói phù hợp</text>
  </g>

  <!-- match chip -->
  <g filter="url(#sh)">
    <rect x="270" y="388" width="166" height="74" rx="18" fill="#fff"/>
    <circle cx="300" cy="425" r="16" fill="#16A06D"/>
    <path d="M292.5 425l5 5 10-10.5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="326" y="419" font-size="12" font-weight="500" fill="#58627F">Phù hợp với bạn</text>
    <text x="326" y="441" font-size="17" font-weight="800" fill="#101B4D">3 gói</text>
  </g>

  <!-- shield chip -->
  <g filter="url(#sh)">
    <rect x="20" y="388" width="164" height="64" rx="18" fill="#fff"/>
    <path d="M54 404l15 6v10c0 9-6 15-15 18-9-3-15-9-15-18v-10z" fill="url(#sd)"/>
    <path d="M48 420l4.5 4.5 8-8.5" stroke="#FFB48F" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="416" font-size="12" font-weight="700" fill="#101B4D">Ẩn danh</text>
    <text x="80" y="434" font-size="11" font-weight="500" fill="#58627F">Không cần CCCD</text>
  </g>

  <!-- coin -->
  <g filter="url(#sh)">
    <circle cx="388" cy="96" r="30" fill="#FFE08A" stroke="#E9A93B" stroke-width="5"/>
    <text x="388" y="106" text-anchor="middle" font-size="26" font-weight="800" fill="#C98722">₫</text>
  </g>
</svg>
