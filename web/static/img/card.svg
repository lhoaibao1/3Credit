<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" font-family="Inter,Segoe UI,Roboto,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC4A3"/><stop offset=".55" stop-color="#FF8A55"/><stop offset="1" stop-color="#F25A20"/></linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357F"/><stop offset=".55" stop-color="#101B4D"/><stop offset="1" stop-color="#0A1238"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9ECF5"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D78E"/><stop offset="1" stop-color="#C99A3E"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#8A2C05" flood-opacity=".34"/></filter>
  </defs>
  <rect width="580" height="320" fill="url(#bg)"/>
  <rect x="50" y="34" width="170" height="220" rx="34" fill="#fff" opacity=".22" transform="skewX(-12)"/>
  <rect x="420" y="30" width="130" height="110" rx="30" fill="#fff" opacity=".24"/>
  <!-- back card (light) -->
  <g filter="url(#sh)" transform="rotate(10 330 160)">
    <rect x="232" y="78" width="250" height="158" rx="18" fill="url(#c2)"/>
    <rect x="232" y="108" width="250" height="30" fill="#101B4D" opacity=".85"/>
    <rect x="252" y="160" width="120" height="22" rx="4" fill="#fff" stroke="#D9DEEA"/>
    <text x="362" y="176" text-anchor="end" font-size="11" font-weight="700" fill="#58627F">CVV</text>
  </g>
  <!-- front card -->
  <g filter="url(#sh)" transform="rotate(-8 230 175)">
    <rect x="96" y="96" width="260" height="164" rx="18" fill="url(#c1)"/>
    <path d="M96 210c60-40 150-40 260-10v42a18 18 0 0 1-18 18H114a18 18 0 0 1-18-18z" fill="#FF642E" opacity=".9"/>
    <rect x="118" y="134" width="44" height="34" rx="7" fill="url(#chip)"/>
    <path d="M118 151h44M140 134v34" stroke="#B8862E" stroke-width="1.4"/>
    <path d="M318 126a12 12 0 0 1 0 18M326 120a22 22 0 0 1 0 30" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".85"/>
    <text x="118" y="200" font-size="18" font-weight="600" letter-spacing="3" fill="#EEF1FF">3368 •••• ••••</text>
    <rect x="118" y="118" width="46" height="6" rx="3" fill="#fff" opacity=".0"/>
  </g>
  <!-- limit chip -->
  <g filter="url(#sh)">
    <rect x="378" y="214" width="170" height="64" rx="18" fill="#fff"/>
    <text x="396" y="240" font-size="12" font-weight="500" fill="#58627F">Hạn mức mong muốn</text>
    <text x="396" y="264" font-size="20" font-weight="700" fill="#101B4D">50 triệu</text>
  </g>
  <g filter="url(#sh)">
    <rect x="62" y="40" width="132" height="36" rx="18" fill="#fff"/>
    <circle cx="82" cy="58" r="9" fill="#FF642E"/>
    <path d="M77.5 58l3 3 6-6.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="63" font-size="12.5" font-weight="700" fill="#101B4D">Theo thu nhập</text>
  </g>
</svg>
